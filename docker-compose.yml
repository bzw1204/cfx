services:
  cfx:
    build: .
    container_name: cfx
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP 服务端口
    environment:
      # 可通过环境变量覆盖配置（可选）
      - CFX_HTTP_ENABLED=true
      - CFX_HTTP_PORT=8080
      - CFX_SCHEDULE_ENABLED=false
      - CFX_SCHEDULE_INTERVAL=1h
